aid: jome
name: Jome
description: Jome is a real estate technology marketplace for buying new construction
  homes, describing itself as the most joyful way to buy a new home in the age of AI.
  Buyers can search and compare thousands of new-construction homes and communities
  from multiple builders, view pricing and builder incentives, instantly book and
  confirm home tours, and receive AI-powered personalized recommendations, with new-home
  experts guiding them from contract to closing. Jome operates as a licensed real
  estate brokerage across 18+ U.S. metros, primarily in Texas, Florida, North Carolina,
  Arizona, Georgia, Colorado, South Carolina, and Tennessee, and runs dedicated portals
  for builders and agents. Backed by Techstars. Jome publishes no public API or developer
  program; this API Evangelist profile captures its company identity and public web
  presence.
